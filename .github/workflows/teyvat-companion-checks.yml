name: Teyvat Companion checks

on:
  push:
    paths:
      - 'teyvat-companion/**'
      - '.github/workflows/teyvat-companion-checks.yml'
  pull_request:
    paths:
      - 'teyvat-companion/**'
      - '.github/workflows/teyvat-companion-checks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teyvat-companion
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Commit the generated lockfile for reproducible installs
        if: github.event_name == 'pull_request' && github.head_ref != ''
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [ -f package-lock.json ] && ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add npm lockfile for reproducible installs"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
      - name: Verify reproducible install
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Build production bundle
        run: npm run build
